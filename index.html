<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AshanChat</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #020914;
      --panel: #081326;
      --panel-2: #0d1d38;
      --accent: #0ea5e9;
      --accent-2: #2563eb;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.16);
      --danger: #ef4444;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Auth / Profile Setup Screen */
    #authScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #0b2244, var(--bg) 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .auth-card {
      width: 100%;
      max-width: 400px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .auth-card h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #fff;
    }

    .auth-card p {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .btn {
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.99);
    }

    /* Main App Layout */
    #appShell {
      display: none;
      flex-direction: column;
      height: 100dvh;
      width: 100%;
    }

    .topbar {
      height: 58px;
      padding: 0 14px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-shrink: 0;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      font-size: 0.95rem;
    }

    .title-wrap {
      min-width: 0;
    }

    .title-wrap .name {
      font-weight: 600;
      font-size: 0.98rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .title-wrap .sub {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .icon-btn {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .icon-btn:active {
      background: rgba(14, 165, 233, 0.18);
    }

    /* Chat List View */
    #chatListView {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .search-box {
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .search-inner {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
    }

    .search-inner input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      padding: 10px 0;
      font-size: 0.92rem;
      outline: none;
    }

    .clear-search {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
      display: none;
    }

    .section-label {
      padding: 10px 14px 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .user-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px 10px 18px;
    }

    .user-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 10px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 4px;
    }

    .user-item:hover, .user-item:active {
      background: var(--panel);
    }

    .user-meta {
      flex: 1;
      min-width: 0;
    }

    .user-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .user-name {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-time {
      font-size: 0.72rem;
      color: var(--muted);
      flex-shrink: 0;
    }

    .user-last {
      font-size: 0.82rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    /* Active Chat Room View */
    #chatRoomView {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 78%;
      padding: 9px 12px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
    }

    .msg.mine {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.theirs {
      align-self: flex-start;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg img, .msg video {
      max-width: 100%;
      max-height: 260px;
      border-radius: 10px;
      display: block;
      margin-top: 4px;
      background: #000;
    }

    .msg-time {
      font-size: 0.68rem;
      opacity: 0.75;
      margin-top: 4px;
      text-align: right;
    }

    .upload-status {
      padding: 6px 14px;
      font-size: 0.78rem;
      color: var(--accent);
      background: rgba(14, 165, 233, 0.1);
      border-top: 1px solid var(--border);
      display: none;
    }

    .composer {
      padding: 8px 10px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .composer input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      min-width: 0;
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      border: 1px solid var(--border);
      z-index: 200;
      display: none;
      max-width: 90%;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Login / Profile Screen -->
  <div id="authScreen">
    <div class="auth-card">
      <h1>AshanChat</h1>
      <p>ඔබගේ නම ඇතුළත් කර chat එකට පිවිසෙන්න.</p>
      <div class="field">
        <label for="usernameInput">ඔබගේ නම (Display Name)</label>
        <input id="usernameInput" type="text" placeholder="උදා: Ashan" maxlength="30" />
      </div>
      <button class="btn" id="enterChatBtn">ඇතුළු වන්න</button>
    </div>
  </div>

  <!-- Main App Shell -->
  <div id="appShell">
    <!-- Chat List View -->
    <div id="chatListView">
      <div class="topbar">
        <div class="topbar-left">
          <div class="avatar" id="myAvatar">A</div>
          <div class="title-wrap">
            <div class="name" id="myNameDisplay">AshanChat</div>
            <div class="sub">Active Chats</div>
          </div>
        </div>
        <button class="icon-btn" id="logoutBtn" title="Change Name">⚙</button>
      </div>

      <div class="search-box">
        <div class="search-inner">
          <span>🔍</span>
          <input id="searchInput" type="text" placeholder="කෙනෙකු Search කරන්න..." autocomplete="off" />
          <button class="clear-search" id="clearSearchBtn">✕</button>
        </div>
      </div>

      <div class="section-label" id="listSectionLabel">Chats</div>
      <div class="user-list" id="userList"></div>
    </div>

    <!-- Active Chat Room View -->
    <div id="chatRoomView">
      <div class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="backToListBtn" title="Back">←</button>
          <div class="avatar" id="peerAvatar">U</div>
          <div class="title-wrap">
            <div class="name" id="peerNameDisplay">User</div>
            <div class="sub" id="peerSubDisplay">Chat</div>
          </div>
        </div>
      </div>

      <div class="messages" id="messagesContainer"></div>
      <div class="upload-status" id="uploadStatus">Uploading media...</div>

      <div class="composer">
        <!-- Photo / Video File Input -->
        <input type="file" id="mediaInput" accept="image/*,video/*" style="display:none;" />
        <button class="icon-btn" id="attachMediaBtn" type="button" title="Photo / Video">📎</button>
        <input id="messageInput" type="text" placeholder="Message එකක් ලියන්න..." autocomplete="off" />
        <button class="send-btn" id="sendMsgBtn" type="button" title="Send">➤</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toastBox"></div>

  <script>
    // ඔයාගේ Firebase Config එක මෙතැනට දාන්න
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // State
    let currentUser = null; // { uid, name }
    let allUsers = {};
    let myChatsMeta = {}; // { peerUid: { lastMessage, updatedAt } }
    let activePeer = null;
    let messagesRef = null;

    // Elements
    const authScreen = document.getElementById("authScreen");
    const appShell = document.getElementById("appShell");
    const usernameInput = document.getElementById("usernameInput");
    const enterChatBtn = document.getElementById("enterChatBtn");
    const myAvatar = document.getElementById("myAvatar");
    const myNameDisplay = document.getElementById("myNameDisplay");
    const logoutBtn = document.getElementById("logoutBtn");
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    const listSectionLabel = document.getElementById("listSectionLabel");
    const userList = document.getElementById("userList");

    const chatListView = document.getElementById("chatListView");
    const chatRoomView = document.getElementById("chatRoomView");
    const backToListBtn = document.getElementById("backToListBtn");
    const peerAvatar = document.getElementById("peerAvatar");
    const peerNameDisplay = document.getElementById("peerNameDisplay");
    const peerSubDisplay = document.getElementById("peerSubDisplay");
    const messagesContainer = document.getElementById("messagesContainer");
    const uploadStatus = document.getElementById("uploadStatus");
    const mediaInput = document.getElementById("mediaInput");
    const attachMediaBtn = document.getElementById("attachMediaBtn");
    const messageInput = document.getElementById("messageInput");
    const sendMsgBtn = document.getElementById("sendMsgBtn");
    const toastBox = document.getElementById("toastBox");

    function showToast(msg) {
      toastBox.textContent = msg;
      toastBox.style.display = "block";
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        toastBox.style.display = "none";
      }, 2800);
    }

    function getChatRoomId(uidA, uidB) {
      return [uidA, uidB].sort().join("__");
    }

    function formatTime(ts) {
      if (!ts) return "";
      const d = new Date(ts);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function getInitial(name) {
      return (name || "U").trim().charAt(0).toUpperCase();
    }

    // Initialize user session
    function initSession() {
      const saved = localStorage.getItem("ashanchat_user_v1");
      if (saved) {
        currentUser = JSON.parse(saved);
        startApp();
      } else {
        authScreen.style.display = "flex";
        appShell.style.display = "none";
      }
    }

    enterChatBtn.addEventListener("click", async () => {
      const name = usernameInput.value.trim();
      if (!name) {
        showToast("කරුණාකර ඔබගේ නම ඇතුළත් කරන්න.");
        return;
      }
      let uid = localStorage.getItem("ashanchat_uid_v1");
      if (!uid) {
        uid = "u_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
        localStorage.setItem("ashanchat_uid_v1", uid);
      }
      currentUser = { uid, name };
      localStorage.setItem("ashanchat_user_v1", JSON.stringify(currentUser));

      await db.ref("users/" + uid).set({
        uid,
        name,
        updatedAt: Date.now()
      });

      startApp();
    });

    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("ashanchat_user_v1");
      currentUser = null;
      activePeer = null;
      authScreen.style.display = "flex";
      appShell.style.display = "none";
    });

    function startApp() {
      authScreen.style.display = "none";
      appShell.style.display = "flex";
      myNameDisplay.textContent = currentUser.name;
      myAvatar.textContent = getInitial(currentUser.name);

      db.ref("users/" + currentUser.uid).update({
        name: currentUser.name,
        updatedAt: Date.now()
      });

      // Listen to all users (used for search & resolving names)
      db.ref("users").on("value", (snap) => {
        allUsers = snap.val() || {};
        renderChatList();
      });

      // Listen ONLY to chats involving currentUser
      db.ref("userChats/" + currentUser.uid).on("value", (snap) => {
        myChatsMeta = snap.val() || {};
        renderChatList();
      });
    }

    // Render ONLY existing chats unless searching
    function renderChatList() {
      if (!currentUser) return;
      const query = searchInput.value.trim().toLowerCase();
      clearSearchBtn.style.display = query ? "inline-block" : "none";
      userList.innerHTML = "";

      if (query) {
        listSectionLabel.textContent = "Search Results";
        const matches = Object.values(allUsers).filter(
          (u) => u && u.uid !== currentUser.uid && (u.name || "").toLowerCase().includes(query)
        );

        if (matches.length === 0) {
          userList.innerHTML = `<div class="empty-state">කිසිවෙකු හමු වුණේ නැහැ.</div>`;
          return;
        }

        matches.forEach((u) => {
          const meta = myChatsMeta[u.uid];
          const item = document.createElement("div");
          item.className = "user-item";
          item.innerHTML = `
            <div class="avatar">${getInitial(u.name)}</div>
            <div class="user-meta">
              <div class="user-top">
                <span class="user-name">${escapeHtml(u.name)}</span>
                <span class="user-time">${meta ? formatTime(meta.updatedAt) : ""}</span>
              </div>
              <div class="user-last">${meta ? escapeHtml(meta.lastMessage || "Chat") : "Tap to start chat"}</div>
            </div>
          `;
          item.addEventListener("click", () => openChatWith(u));
          userList.appendChild(item);
        });
      } else {
        listSectionLabel.textContent = "Recent Chats";
        // Only users that have an active/past chat entry in userChats/{uid}
        const chatEntries = Object.entries(myChatsMeta)
          .filter(([peerUid, meta]) => peerUid !== currentUser.uid && meta && meta.lastMessage)
          .sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

        if (chatEntries.length === 0) {
          userList.innerHTML = `
            <div class="empty-state">
              තවම chats නැහැ.<br/>
              ඉහළ Search box එකෙන් කෙනෙකු සොයා chat ආරම්භ කරන්න.
            </div>
          `;
          return;
        }

        chatEntries.forEach(([peerUid, meta]) => {
          const peerInfo = allUsers[peerUid] || { uid: peerUid, name: meta.peerName || "User" };
          const item = document.createElement("div");
          item.className = "user-item";
          item.innerHTML = `
            <div class="avatar">${getInitial(peerInfo.name)}</div>
            <div class="user-meta">
              <div class="user-top">
                <span class="user-name">${escapeHtml(peerInfo.name)}</span>
                <span class="user-time">${formatTime(meta.updatedAt)}</span>
              </div>
              <div class="user-last">${escapeHtml(meta.lastMessage)}</div>
            </div>
          `;
          item.addEventListener("click", () => openChatWith(peerInfo));
          userList.appendChild(item);
        });
      }
    }

    searchInput.addEventListener("input", renderChatList);
    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      renderChatList();
    });

    function openChatWith(peer) {
      activePeer = peer;
      peerNameDisplay.textContent = peer.name || "User";
      peerAvatar.textContent = getInitial(peer.name);
      peerSubDisplay.textContent = "Direct Chat";

      chatListView.style.display = "none";
      chatRoomView.style.display = "flex";
      messagesContainer.innerHTML = "";

      if (messagesRef) {
        messagesRef.off();
      }
      const roomId = getChatRoomId(currentUser.uid, peer.uid);
      messagesRef = db.ref("messages/" + roomId);

      messagesRef.limitToLast(80).on("child_added", (snap) => {
        const msg = snap.val();
        if (!msg) return;
        appendMessageBubble(msg);
      });
    }

    backToListBtn.addEventListener("click", () => {
      if (messagesRef) {
        messagesRef.off();
        messagesRef = null;
      }
      activePeer = null;
      chatRoomView.style.display = "none";
      chatListView.style.display = "flex";
      renderChatList();
    });

    function appendMessageBubble(msg) {
      const isMine = msg.senderId === currentUser.uid;
      const div = document.createElement("div");
      div.className = "msg " + (isMine ? "mine" : "theirs");

      let contentHtml = "";
      if (msg.type === "image" && msg.mediaData) {
        contentHtml += `<img src="${msg.mediaData}" alt="photo" loading="lazy" />`;
      } else if (msg.type === "video" && msg.mediaData) {
        contentHtml += `<video src="${msg.mediaData}" controls playsinline></video>`;
      }
      if (msg.text) {
        contentHtml += `<div>${escapeHtml(msg.text)}</div>`;
      }
      contentHtml += `<div class="msg-time">${formatTime(msg.timestamp)}</div>`;
      div.innerHTML = contentHtml;

      messagesContainer.appendChild(div);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function saveChatMeta(peer, previewText, ts) {
      const updates = {};
      updates[`userChats/${currentUser.uid}/${peer.uid}`] = {
        peerUid: peer.uid,
        peerName: peer.name || "User",
        lastMessage: previewText,
        updatedAt: ts
      };
      updates[`userChats/${peer.uid}/${currentUser.uid}`] = {
        peerUid: currentUser.uid,
        peerName: currentUser.name,
        lastMessage: previewText,
        updatedAt: ts
      };
      await db.ref().update(updates);
    }

    async function sendTextMessage() {
      const text = messageInput.value.trim();
      if (!text || !activePeer || !currentUser) return;

      messageInput.value = "";
      const ts = Date.now();
      const roomId = getChatRoomId(currentUser.uid, activePeer.uid);

      try {
        await db.ref("messages/" + roomId).push({
          senderId: currentUser.uid,
          senderName: currentUser.name,
          type: "text",
          text,
          timestamp: ts
        });
        await saveChatMeta(activePeer, text, ts);
      } catch (err) {
        showToast("Message යවන්න බැරි වුණා.");
      }
    }

    sendMsgBtn.addEventListener("click", sendTextMessage);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendTextMessage();
      }
    });

    // Photo & Video Upload Handler
    attachMediaBtn.addEventListener("click", () => {
      if (!activePeer) {
        showToast("මුලින්ම chat එකක් තෝරන්න.");
        return;
      }
      mediaInput.value = "";
      mediaInput.click();
    });

    mediaInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file || !activePeer || !currentUser) return;

      const isVideo = file.type.startsWith("video/");
      const isImage = file.type.startsWith("image/");

      if (!isImage && !isVideo) {
        showToast("Photo හෝ Video file එකක් පමණක් තෝරන්න.");
        return;
      }

      uploadStatus.style.display = "block";
      uploadStatus.textContent = isVideo ? "Video සකසමින් පවතී..." : "Photo සකසමින් පවතී...";

      try {
        let dataUrl = "";
        if (isImage) {
          dataUrl = await compressImageToDataUrl(file, 960, 0.72);
        } else {
          // Keep video small enough for Realtime Database (~2.5MB limit safety)
          if (file.size > 2.2 * 1024 * 1024) {
            throw new Error("Video size එක 2.2MB වඩා අඩු video එකක් තෝරන්න.");
          }
          dataUrl = await readFileAsDataUrl(file);
        }

        uploadStatus.textContent = "Uploading...";
        const ts = Date.now();
        const roomId = getChatRoomId(currentUser.uid, activePeer.uid);

        await db.ref("messages/" + roomId).push({
          senderId: currentUser.uid,
          senderName: currentUser.name,
          type: isVideo ? "video" : "image",
          mediaData: dataUrl,
          text: "",
          timestamp: ts
        });

        await saveChatMeta(activePeer, isVideo ? "🎥 Video" : "📷 Photo", ts);
        showToast(isVideo ? "Video upload වුණා!" : "Photo upload වුණා!");
      } catch (err) {
        showToast(err.message || "Upload කරන්න බැරි වුණා.");
      } finally {
        uploadStatus.style.display = "none";
        mediaInput.value = "";
      }
    });

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("File කියවන්න බැරි වුණා."));
        reader.readAsDataURL(file);
      });
    }

    function compressImageToDataUrl(file, maxDim = 960, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let { width, height } = img;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);
          const out = canvas.toDataURL("image/jpeg", quality);
          resolve(out);
        };
        img.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("Photo එක load කරන්න බැරි වුණා."));
        };
        img.src = url;
      });
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    initSession();
  </script>
</body>
</html>
